<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Retail Order System{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f8fafc, #eef2ff);
            min-height: 100vh;
            margin: 0;
        }

        /* NAVBAR */
        .navbar {
            background: rgba(1, 35, 56, 0.9) !important;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 16px 0;
        }

        .navbar-brand {
            font-size: 22px;
            font-weight: 700;
            color: white !important;
            letter-spacing: -0.5px;
        }

        .nav-link {
            color: rgba(255,255,255,0.8) !important;
            font-weight: 500;
            margin-left: 12px;
            transition: 0.3s;
            border-radius: 10px;
            padding: 8px 14px !important;
        }

        .nav-link:hover {
            color: white !important;
            background: rgba(255,255,255,0.08);
        }

        /* PAGE CONTAINER */
        .main-container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 0 20px;
        }

        /* CARDS */
        .card {
            border: none;
            border-radius: 22px;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 40px rgba(0,0,0,0.12);
        }

        h3, h4, h5 {
            font-weight: 700;
            color: #0f172a;
        }

        /* BUTTONS */
        .btn-primary {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            border: none;
            border-radius: 14px;
            padding: 12px 24px;
            font-weight: 600;
            box-shadow: 0 6px 18px rgba(79,70,229,0.25);
            transition: 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        /* INPUTS */
        .form-control {
            border-radius: 14px;
            padding: 12px;
            border: 1px solid #dbeafe;
            box-shadow: none !important;
        }

        .form-control:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99,102,241,0.15) !important;
        }

        /* TABLES */
        table {
            border-radius: 14px;
            overflow: hidden;
        }

        .table thead {
            background: #f8fafc;
        }

        .table th {
            font-weight: 600;
            color: #334155;
        }

        footer {
            text-align: center;
            color: #64748b;
            padding: 30px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/ui/upload">Retail Order System</a>

        <div class="collapse navbar-collapse show">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/ui/upload">Generate Order</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/ui/history">Order History</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/ui/dashboard">Dashboard</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="main-container">
    {% block content %}{% endblock %}
</div>

<footer>
    Retail Order Automation System © 2026
</footer>

</body>
</html>
